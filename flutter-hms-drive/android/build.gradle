group 'com.huawei.hms.flutter.drive'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://developer.huawei.com/repo/" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://developer.huawei.com/repo/" }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 36
    buildToolsVersion "30.0.3"

    if (project.android.hasProperty("namespace")) {
        namespace 'com.huawei.hms.flutter.drive'
    }

    defaultConfig {
        minSdkVersion 27
        targetSdkVersion 36
    }

    lintOptions {
        disable "InvalidPackage"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.huawei.hms:drive:5.0.0.307'
    implementation "com.huawei.hms:device:6.6.0.300"
    implementation 'com.huawei.hms:stats:6.6.0.300'
    implementation "com.google.code.gson:gson:2.9.0"
}
